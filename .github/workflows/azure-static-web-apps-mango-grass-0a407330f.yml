name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ "main" ]

env:
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Inject Supabase anon key
      shell: bash
      run: |
        FILE="FitnessTracker.V1/wwwroot/appsettings.Production.json"
        if [ ! -f "$FILE" ]; then
          cp FitnessTracker.V1/wwwroot/appsettings.json "$FILE"
        fi
        tmp=$(mktemp)
        jq --arg key "$SUPABASE_ANON_KEY" '.Supabase.AnonKey = $key' "$FILE" > "$tmp"
        mv "$tmp" "$FILE"
        echo "✅ AnonKey injecté"

    - name: Build & Deploy
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_GRASS_0A407330F }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: upload
        app_location: "./FitnessTracker.V1"
        api_location: "Api"
        output_location: "FitnessTracker.V1/bin/Release/net8.0/publish/wwwroot"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close PR Environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_GRASS_0A407330F }}
          action: close
