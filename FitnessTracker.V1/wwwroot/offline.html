<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14a44d" />
    <title>FitnessTracker hors ligne</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #111827;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 420px);
            background: #ffffff;
            border: 1px solid #e6edf5;
            border-radius: 16px;
            box-shadow: 0 18px 40px rgba(43, 45, 66, 0.12);
            padding: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.6rem;
        }

        p {
            margin: 0 0 18px;
            color: #64748b;
            line-height: 1.45;
            font-weight: 650;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 999px;
            background: #14a44d;
            color: white;
            font-size: 1rem;
            font-weight: 800;
            padding: 12px 16px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Mode hors ligne</h1>
        <p>L'application est installée, mais cette page n'est pas encore disponible sans connexion. Reviens en ligne puis réessaie.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
</body>
</html>
